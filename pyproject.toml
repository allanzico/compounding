[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbets"
version = "2.0.0"
description = "Compounding Bets — Method v2: model, gate, pick log, daily agent"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "requests>=2.28"]

[tool.setuptools]
packages = ["cbets"]
