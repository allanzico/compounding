name: fetch football data

on:
  schedule:
    # 05:10 UTC daily — before the Claude task at 06:00 UTC, so the data is fresh.
    - cron: "10 5 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch
        run: python scripts/fetch_data.py

      - name: Commit if anything changed
        run: |
          git config user.name  "cbets-bot"
          git config user.email "cbets-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          fi
